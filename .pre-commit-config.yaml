# https://pre-commit.com
# Install once: pip install pre-commit && pre-commit install
#
# clang-tidy needs compile_commands.json from a Ninja configure, e.g.:
#   cmake --preset clang-Ninja
# Optional: set AEROVISTA_TIDY_BUILD_DIR to the build directory.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: ^thirdparty/

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (engine naming)
        entry: python scripts/clang_tidy_engine.py
        language: system
        types_or: [c++, c]
        files: ^engine/.*\.(cpp|cc|cxx|h|hpp|hh|hxx)$
        exclude: (^thirdparty/|engine/source/function/sync/Network\.(cpp|h)$)
        pass_filenames: true
        require_serial: true
