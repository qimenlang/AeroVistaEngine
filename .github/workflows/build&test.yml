name: Build and Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check formatting
        run: pre-commit run clang-format --all-files --show-diff-on-failure

  build-test:
    name: ${{ matrix.preset }}
    needs: clang-format
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ci-debug, ci-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup Vulkan SDK and Lavapipe
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.321.1
          install_runtime: true
          install_lavapipe: true
          cache: true
          stripdown: true

      - name: Verify Vulkan (Lavapipe)
        shell: pwsh
        run: |
          # Windows SDK ships vulkaninfoSDK.exe (not vulkaninfo).
          vulkaninfoSDK.exe --summary
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
